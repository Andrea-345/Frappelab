<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Categoría')}"></head>
<body>
<div class="bubbles"><span></span><span></span><span></span><span></span><span></span><span></span></div>
<nav th:replace="~{fragments :: nav('categorias')}"></nav>

<main class="container narrow">
    <div class="card form-card">
        <h1 th:text="${categoria.id == null} ? 'Nueva categoría' : 'Editar categoría'">Nueva categoría</h1>

        <form method="post"
              th:action="${categoria.id == null} ? @{/categorias/create} : @{/categorias/edit/{id}(id=${categoria.id})}"
              th:object="${categoria}">

            <div class="field">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}" placeholder="Ej. Clásicos">
                <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </div>

            <div class="field">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" rows="3" th:field="*{descripcion}" placeholder="Describe la categoría"></textarea>
                <span class="error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a class="btn btn-ghost" th:href="@{/categorias}">Cancelar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
