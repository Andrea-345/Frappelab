<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Categorías')}"></head>
<body>
<div class="bubbles"><span></span><span></span><span></span><span></span><span></span><span></span></div>
<nav th:replace="~{fragments :: nav('categorias')}"></nav>

<main class="container">
    <div class="page-head">
        <div>
            <h1>Categorías</h1>
            <p class="muted">Organiza tus frappés por estilo.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/categorias/create}">+ Nueva categoría</a>
    </div>

    <div class="alert" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <table class="table">
            <thead>
            <tr><th>Nombre</th><th>Descripción</th><th class="right">Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${categorias}">
                <td><strong th:text="${c.nombre}">Clásicos</strong></td>
                <td th:text="${c.descripcion}">Descripción</td>
                <td class="right actions">
                    <a class="chip" th:href="@{/categorias/edit/{id}(id=${c.id})}">Editar</a>
                    <a class="chip" th:href="@{/categorias/details/{id}(id=${c.id})}">Detalles</a>
                    <a class="chip chip-danger" th:href="@{/categorias/delete/{id}(id=${c.id})}">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="3" class="empty">Aún no hay categorías. ¡Crea la primera!</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
