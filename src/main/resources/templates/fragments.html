<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · FrostMood'">FrostMood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="nav" th:fragment="nav(active)">
    <a class="brand" th:href="@{/}">❄️ FrostMood</a>
    <div class="nav-links">
        <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">Inicio</a>
        <a th:href="@{/categorias}" th:classappend="${active == 'categorias'} ? 'active'">Categorías</a>
        <a th:href="@{/frappes}" th:classappend="${active == 'frappes'} ? 'active'">Frappés</a>
    </div>
</nav>
<footer class="footer" th:fragment="footer">
    © 2026 FrostMood · Cada sorbo, un estado de ánimo
</footer>
</body>
</html>
