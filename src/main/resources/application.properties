spring.application.name=frostmood

# Base de datos (se leen de variables de entorno; los valores después de ":" son para correr en local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/frostmood}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Puerto (Render define PORT; en Beanstalk se usa SERVER_PORT=5000)
server.port=${PORT:8080}

